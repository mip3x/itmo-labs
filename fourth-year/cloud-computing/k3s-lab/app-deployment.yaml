apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: health-demo
  template:
    metadata:
      labels:
        app: health-demo
    spec:
      containers:
      - name: web-app
        image: registry.k8s.io/e2e-test-images/agnhost:2.39
        command: ["/bin/sh", "-c"]
        args:
        - |
          apk add --no-cache python3 >/dev/null 2>&1
          python3 -c "
          import os, http.server
          st = {'ready': True, 'alive': True}
          host = os.environ.get('HOSTNAME', '')
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == '/hostname':
                      body = (host + '\n').encode()
                      self.send_response(200)
                      self.send_header('Content-Length', str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  elif self.path == '/healthz':
                      self.send_response(200 if (st['ready'] and st['alive']) else 500)
                      self.end_headers(); self.wfile.write(b'OK' if (st['ready'] and st['alive']) else b'ERR')
                  elif self.path == '/make-not-ready':
                      st['ready'] = False; self.send_response(200); self.end_headers(); self.wfile.write(b'OK')
                  elif self.path == '/make-ready':
                      st['ready'] = True; st['alive'] = True; self.send_response(200); self.end_headers(); self.wfile.write(b'OK')
                  elif self.path == '/make-not-alive':
                      st['alive'] = False; st['ready'] = False; self.send_response(200); self.end_headers(); self.wfile.write(b'OK')
          http.server.HTTPServer(('0.0.0.0', 8080), H).serve_forever()
          "
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 3
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: health-service
spec:
  selector:
    app: health-demo
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP